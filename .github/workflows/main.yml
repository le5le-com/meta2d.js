name: Publish to npm on release

on:
  push:
    tags:
      - 'v2.*'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build
        run: |
          pnpm --filter './packages/*' -r build
          node scripts/fix-worker-paths.mjs

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> "$GITHUB_OUTPUT"

      - name: Update core version
        run: |
          cd dist/core
          npm version ${{ steps.extract_version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Update bundle version
        run: |
          cd dist/meta2d.js
          npm version ${{ steps.extract_version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Publish all packages
        run: |
          failed=0
          for dir in dist/*/; do
            [ -f "$dir/package.json" ] || continue
            cd "$dir"
            pkg=$(node -p "require('./package.json').name")
            ver=$(node -p "require('./package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "== $pkg@$ver already published, skip"
            else
              echo "== publishing $pkg@$ver"
              npm publish --provenance || failed=1
            fi
            cd - > /dev/null
          done
          exit $failed
