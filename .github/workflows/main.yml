name: Publish to npm on release

on:
  push:
    tags:
      - 'v2.*'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> "$GITHUB_OUTPUT"

      - name: Update core version
        run: |
          cd dist/core
          npm version ${{ steps.extract_version.outputs.VERSION }} --no-git-tag-version

      - name: Update bundle version
        run: |
          cd dist/meta2d.js
          npm version ${{ steps.extract_version.outputs.VERSION }} --no-git-tag-version

      - name: Publish core
        run: |
          cd dist/core
          npm publish
        continue-on-error: true

      - name: Publish bundle
        run: |
          cd dist/meta2d.js
          npm publish
        continue-on-error: true

      - name: Publish chart
        run: |
          cd dist/chart
          npm publish
        continue-on-error: true

      - name: Publish data-upgrade
        run: |
          cd dist/data-upgrade
          npm publish
        continue-on-error: true

      - name: Publish echarts
        run: |
          cd dist/echarts
          npm publish
        continue-on-error: true

      - name: Publish form
        run: |
          cd dist/form
          npm publish
        continue-on-error: true

      - name: Publish fta
        run: |
          cd dist/fta
          npm publish
        continue-on-error: true

      - name: Publish svg
        run: |
          cd dist/svg
          npm publish
        continue-on-error: true

      - name: Publish uml
        run: |
          cd dist/uml
          npm publish
        continue-on-error: true
